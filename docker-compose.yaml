
services:
  # 1. Trái tim lưu trữ: PostgreSQL
  postgres:
    image: postgres:16-alpine # Dùng bản Alpine cho siêu nhẹ
    container_name: claw_postgres
    restart: always
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - POSTGRES_USER=${DB_USER:-clawadmin}
      - POSTGRES_PASSWORD=${DB_PASS:-clawsecret}
      - POSTGRES_DB=${DB_NAME:-clawmarket}

    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Bất tử hóa dữ liệu
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql # Tự động tạo database và bảng khi khởi động
    networks:
      - claw_network
  # 2. Trái tim tốc độ: Redis
  redis:
    image: redis:7-alpine
    container_name: claw_redis
    networks:
      - claw_network
    restart: always
    ports:
      - "6380:6379"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - redis_data:/data # Lưu cache ra ổ cứng phòng khi sập nguồn
    command: redis-server --save 60 1 --loglevel warning

  # 3. Con Bot cào dữ liệu của sếp (Đã làm ở Phase 1)
  
  cellphone_claw_scraper:
    image: allocknguyen/playwright-scaper:v6
    networks:
      - claw_network
    command: node src/cellphone_index.js
    container_name: cellphone_claw_scraper
    restart: always
    depends_on:
      - postgres
      - redis
    volumes:
      - ./scraper/src:/app/src # Mount code vào container để dễ chỉnh sửa
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
  fpt_claw_scraper:
    image: allocknguyen/playwright-scaper:v6
    networks:
      - claw_network
    command: node src/fpt_index.js
    container_name: fpt_claw_scraper
    restart: always
    depends_on:
      - postgres
      - redis
    volumes:
      - ./scraper/src:/app/src # Mount code vào container để dễ chỉnh sửa
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
  tgdd_claw_scraper:
    image: allocknguyen/playwright-scaper:v6
    networks:
      - claw_network
    command: node src/tgdd_index.js
    container_name: tgdd_claw_scraper
    restart: always
    depends_on:
      - postgres
      - redis
    volumes:
      - ./scraper/src:/app/src # Mount code vào container để dễ chỉnh sửa
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
  claw_worker:
    image: allocknguyen/playwright-scaper:v6
    networks:
      - claw_network
    command: node src/worker.js
    container_name: claw_worker
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./scraper/src:/app/src # Mount code vào container để dễ chỉnh sửa
    env_file:
      - .env  
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    container_name: claw_dbt
    volumes:
      - ./database/dbt_transform:/usr/app
      - ~/.dbt:/root/.dbt
    networks:
      - claw_network
    environment:
      - DBT_PROFILES_DIR=/usr/app
    profiles: ["dbt_only"]

  claw_fastapi:
    build: ./backend
    networks:
      - claw_network
    container_name: claw_fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app # Mount code vào container để dễ chỉnh sửa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env  
    environment:
      DATABASE_URL: "postgresql://clawsense_viewer:viewer_secret_123@postgres:5432/clawmarket"
      GEMINI_API_KEYS: ${GEMINI_API_KEYS}
    restart: always

  jenkins:
    build: ./Jenkins
    container_name: jenkins
    user: root # Để có quyền chạy docker lệnh
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Để Jenkins điều khiển Docker máy thật
    networks:
      - claw_network
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - claw_network

  # --- 3. Grafana (Giao diện hiển thị siêu ngầu) ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Sếp có thể đổi pass ở đây
    networks:
      - claw_network
volumes:
  postgres_data:
  redis_data:
  jenkins_home: 
networks:
  claw_network:
    driver: bridge